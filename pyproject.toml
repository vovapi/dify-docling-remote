[project]
name = "dify-docling-remote"
version = "0.1.4"
description = "Dify tools for a self-hosted Docling Serve"
requires-python = ">=3.12,<3.14"
dependencies = ["dify-plugin==0.10.2", "httpx==0.28.1", "PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
